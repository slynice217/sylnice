<script>
  (function () {
    try {
      const nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
      if (nav && nav.type === "reload") window.location.replace("./index.html");
    } catch (_) {}
  })();
</script>

}

}
body, body * {
  font-family: inherit !important;
  font-synthesis: none !important;
}

<script>
  window.addEventListener('pageshow', function (event) {
    // 如果页面是从浏览器的往返缓存（bfcache）里恢复的，或者是从其他页面点回来的
    if (event.persisted || (typeof window.performance != "undefined" && window.performance.getEntriesByType("navigation")[0].type === "back_forward")) {
      window.location.reload();
    }
  });
</script>
<style>

    position: fixed; top: 16px; right: 16px; z-index: 2147483000;
    width: 76px; height: 36px; padding: 3px; border: 1px solid rgba(106,84,135,.28);
    border-radius: 999px; background: rgba(255,255,255,.88); color: #604d79;
    box-shadow: 0 4px 16px rgba(40,18,111,.12); backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    font: 600 14px/1 system-ui, -apple-system, "Microsoft YaHei", sans-serif;

  .site-language-toggle .lang-label { position: relative; z-index: 2; width: 32px; text-align: center; transition: color .2s ease; }

  .site-language-toggle .lang-label { color: #604d79; }

  .site-language-toggle[data-lang="tw"] .lang-tw { color: #fff; }
  .site-language-toggle:focus-visible { outline: 2px solid #8b67d0; outline-offset: 3px; }
  /* Mobile navigation visibility safeguard: keep the hamburger visible beside the language toggle. */
  @media (max-width: 768px) {

    .blokko-site-nav .blokko-nav-burger {

      position: relative !important;

  <span class="lang-knob" aria-hidden="true"></span><span class="lang-label lang-cn">简</span><span class="lang-label lang-tw">繁</span>

<main>
<h1>Gallery</h1>
<div id="albums"><p class="gallery-loading">前两个单击可翻面……</p></div>
</main>
<div id="viewer" class="hidden"><button id="back">返回</button><div id="photos"></div></div>
<script>
(() => {
  'use strict';
  const albumNumbers = [1, 2, 3];
  const photoCount = 5;

  // 图集二每张照片翻面后的文字：以后直接编辑下面对应的引号内容即可。
  // 图集一每张照片翻面后的文字：以后直接编辑下面对应的引号内容即可。
  // 每一项依次对应 album1/1.webp、album1/2.webp……album1/5.webp。
  const album1BackTexts = [
    '自己赚钱买的演唱会票呀，虽然坐山顶但我下次会再近一点的！',
    '和你一起在校园里并肩走似乎是上个世纪的事情了，但又觉得好像只是在走廊等了你两分钟而已 。',
    '惠中季节限定的起床福利',
    '姑姐请我吃板前，有时候真的觉得我这辈子太幸运了…\n感恩',
    'not a view for tears to watch,\nnor a place for tears to land'
  ];

  // 图集二每张照片翻面后的文字：以后直接编辑下面对应的引号内容即可。
  const album2BackTexts = [
    '三年前，完全松弛感…',
    '某个儿童节她竟然给我买礼物，因为不知道我喜欢啥买了两个阿尼亚哈哈哈哈',
    '这是买DJI的第一天拍的，好萌吧',
    '建模怪连走路随便拍都能出片啥意思。',
    '♡'
  ];
  const root = document.getElementById('albums');
  if (!root) return;

  function buildAlbum(number) {
    const section = document.createElement('section');
    section.className = 'album';
    const title = document.createElement('div');
    title.className = 'album-title';
    title.textContent = number === 1 ? '某年某月某个星期几' : number === 2 ? '猜猜我有多爱你' : '宝贝nikki';
    section.appendChild(title);

    const carousel = document.createElement('div');
    carousel.className = 'album-carousel depth-stack';
    carousel.tabIndex = 0;
    carousel.setAttribute('aria-label', title.textContent + '，可使用左右箭头按钮或键盘方向键切换照片');
    const track = document.createElement('div');
    track.className = 'album-track';

    for (let index = 1; index <= photoCount; index++) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'depth-card';
      card.setAttribute('aria-label', '照片 ' + index + '，点击翻面');
      card.innerHTML = (number === 1 || number === 2)
        ? '<div class="depth-card-inner"><div class="depth-face depth-front"><img alt="" draggable="false"></div><div class="depth-face depth-back"><span>0' + index + ' / 05</span><p></p><small>点击翻回照片</small></div></div>'
        : '<div class="depth-card-inner"><div class="depth-face depth-front"><img alt="" draggable="false"></div></div>';
      if (number === 1) { const backText = card.querySelector('.depth-back p'); backText.textContent = album1BackTexts[index - 1]; backText.style.whiteSpace = 'pre-line'; }
      if (number === 2) card.querySelector('.depth-back p').textContent = album2BackTexts[index - 1];
      const img = card.querySelector('img');
      img.src = './assets/gallery/album' + number + '/' + index + '.webp';
      img.decoding = 'async';
      img.onerror = () => {
        card.classList.add('photo-missing');
        img.alt = '图集' + number + '的第' + index + '张照片尚未上传';
        img.removeAttribute('src');
        card.disabled = true;
      };
      if (number === 1 || number === 2) card.addEventListener('click', () => card.classList.toggle('is-flipped'));
      track.appendChild(card);
    }

    carousel.appendChild(track);

    // Desktop-friendly controls: visible arrows, while preserving touch swipe on mobile.
    const controls = document.createElement('div');
    controls.className = 'desktop-carousel-controls';
    controls.innerHTML = '<button type="button" class="carousel-arrow carousel-prev" aria-label="上一张照片">‹</button><span class="carousel-position" aria-live="polite">1 / ' + photoCount + '</span><button type="button" class="carousel-arrow carousel-next" aria-label="下一张照片">›</button>';
    carousel.appendChild(controls);

    section.appendChild(carousel);
    root.appendChild(section);

    const cards = Array.from(track.children);
    const positionLabel = controls.querySelector('.carousel-position');
    let current = 0;
    let startX = 0;
    let startY = 0;
    let dragging = false;
    function render() {
      positionLabel.textContent = (current + 1) + ' / ' + cards.length;
      cards.forEach((card, i) => {
        let offset = i - current;
        if (offset > cards.length / 2) offset -= cards.length;
        if (offset < -cards.length / 2) offset += cards.length;
        const distance = Math.abs(offset);
        const x = offset * (window.innerWidth <= 600 ? 30 : 40);
        card.style.transform = 'translate3d(' + x + 'px,' + (distance * 5) + 'px,' + (-distance * 95) + 'px) rotateY(' + (-offset * 13) + 'deg) rotateZ(' + (-offset * 2.5) + 'deg) scale(' + (offset === 0 ? .9 : Math.max(.62, .9 - distance * .09)) + ')';
        card.style.zIndex = String(10 - distance);
        card.style.opacity = distance > 2 ? '0' : '1';
        card.style.pointerEvents = distance > 2 ? 'none' : 'auto';
        card.tabIndex = distance === 0 ? 0 : -1;
      });
    }

    function movePhoto(direction) {
      current = (current + direction + cards.length) % cards.length;
      render();
    }
    controls.querySelector('.carousel-prev').addEventListener('click', event => {
      event.stopPropagation();
      movePhoto(-1);
    });
    controls.querySelector('.carousel-next').addEventListener('click', event => {
      event.stopPropagation();
      movePhoto(1);
    });
    carousel.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        movePhoto(-1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        movePhoto(1);
      }
    });

    carousel.addEventListener('pointerdown', event => {
      startX = event.clientX;
      startY = event.clientY;
      dragging = true;
    });
    carousel.addEventListener('pointerup', event => {
      if (!dragging) return;
      dragging = false;
      const dx = event.clientX - startX;
      const dy = event.clientY - startY;
      if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy)) {
        current = (current + (dx < 0 ? 1 : -1) + cards.length) % cards.length;
        render();
      }
    });
    carousel.addEventListener('pointercancel', () => { dragging = false; });
    render();
  }

  albumNumbers.forEach(buildAlbum);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>

</html>
