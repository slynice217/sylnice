<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
  (function () {
    try {
      const nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
      if (nav && nav.type === "reload") window.location.replace("./index.html");
    } catch (_) {}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<link rel="stylesheet" href="./gallery.css?v=d4c1c71c6743">

<style id="site-songti-font">
/* 全站统一宋体；使用各平台可用的宋体字库 */
html, body, body *, body *::before, body *::after {
  font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif !important;
}
</style>

<style id="force-light-mode">
/* 网站固定使用浅色主题，不跟随手机系统深色模式 */
:root { color-scheme: light !important; }
html, html.dark-mode, html:not(.light-mode), body {
  color-scheme: light !important;
  background-color: #EEECF5;
}
</style>
<style id="local-system-serif-font">
/* Local system fonts only: no network font requests or font swapping. */
body {
  font-family: "Songti SC", "SimSun", "STSong", "SimHei", serif !important;
}
body, body * {
  font-family: inherit !important;
  font-synthesis: none !important;
}
</style>
<script>
  window.addEventListener('pageshow', function (event) {
    // 如果页面是从浏览器的往返缓存（bfcache）里恢复的，或者是从其他页面点回来的
    if (event.persisted || (typeof window.performance != "undefined" && window.performance.getEntriesByType("navigation")[0].type === "back_forward")) {
      window.location.reload();
    }
  });
</script>
</head>
<body>
<nav class="nav"><a href="./index.html">首页</a><a href="./page.html">装修日志</a><a href="./admin.html">管理员登录</a><a href="./gallery.html">Gallery</a></nav>
<main>
<h1>Gallery</h1>
<div id="albums"><p class="gallery-loading">正在加载照片……</p></div>
</main>
<div id="viewer" class="hidden"><button id="back">返回</button><div id="photos"></div></div>
<script>
(() => {
  'use strict';
  const albumNumbers = [1, 2, 3];
  const photoCount = 5;

  // 图集二每张照片翻面后的文字：以后直接编辑下面对应的引号内容即可。
  const album2BackTexts = [
    '三年前，完全松弛感…',
    '某个儿童节她竟然给我买礼物，因为不知道我喜欢啥买了两个阿尼亚哈哈哈哈',
    '这是买DJI的第一天拍的，好萌吧',
    '建模怪连走路随便拍都能出片啥意思。',
    '♡'
  ];
  const root = document.getElementById('albums');
  if (!root) return;

  function buildAlbum(number) {
    const section = document.createElement('section');
    section.className = 'album';
    const title = document.createElement('div');
    title.className = 'album-title';
    title.textContent = number === 2 ? '点击可翻面' : number === 3 ? '宝贝nikki' : '图集' + number;
    section.appendChild(title);

    const carousel = document.createElement('div');
    carousel.className = 'album-carousel depth-stack';
    carousel.setAttribute('aria-label', title.textContent + '，左右滑动切换照片');
    const track = document.createElement('div');
    track.className = 'album-track';

    for (let index = 1; index <= photoCount; index++) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'depth-card';
      card.setAttribute('aria-label', '照片 ' + index + '，点击翻面');
      card.innerHTML = number === 2
        ? '<div class="depth-card-inner"><div class="depth-face depth-front"><img alt="" draggable="false"></div><div class="depth-face depth-back"><span>0' + index + ' / 05</span><h3>图集 2</h3><p></p><small>点击翻回照片</small></div></div>'
        : '<div class="depth-card-inner"><div class="depth-face depth-front"><img alt="" draggable="false"></div></div>';
      if (number === 2) card.querySelector('.depth-back p').textContent = album2BackTexts[index - 1];
      const img = card.querySelector('img');
      img.src = './assets/gallery/album' + number + '/' + index + '.webp';
      img.decoding = 'async';
      img.onerror = () => {
        card.classList.add('photo-missing');
        img.alt = '图集' + number + '的第' + index + '张照片尚未上传';
        img.removeAttribute('src');
        card.disabled = true;
      };
      if (number === 2) card.addEventListener('click', () => card.classList.toggle('is-flipped'));
      track.appendChild(card);
    }

    carousel.appendChild(track);
    section.appendChild(carousel);
    root.appendChild(section);

    const cards = Array.from(track.children);
    let current = 0;
    let startX = 0;
    let startY = 0;
    let dragging = false;
    function render() {
      cards.forEach((card, i) => {
        let offset = i - current;
        if (offset > cards.length / 2) offset -= cards.length;
        if (offset < -cards.length / 2) offset += cards.length;
        const distance = Math.abs(offset);
        const x = offset * (window.innerWidth <= 600 ? 30 : 40);
        card.style.transform = 'translate3d(' + x + 'px,' + (distance * 5) + 'px,' + (-distance * 95) + 'px) rotateY(' + (-offset * 13) + 'deg) rotateZ(' + (-offset * 2.5) + 'deg) scale(' + (offset === 0 ? .9 : Math.max(.62, .9 - distance * .09)) + ')';
        card.style.zIndex = String(10 - distance);
        card.style.opacity = distance > 2 ? '0' : '1';
        card.style.pointerEvents = distance > 2 ? 'none' : 'auto';
        card.tabIndex = distance === 0 ? 0 : -1;
      });
    }

    carousel.addEventListener('pointerdown', event => {
      startX = event.clientX;
      startY = event.clientY;
      dragging = true;
    });
    carousel.addEventListener('pointerup', event => {
      if (!dragging) return;
      dragging = false;
      const dx = event.clientX - startX;
      const dy = event.clientY - startY;
      if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy)) {
        current = (current + (dx < 0 ? 1 : -1) + cards.length) % cards.length;
        render();
      }
    });
    carousel.addEventListener('pointercancel', () => { dragging = false; });
    render();
  }

  albumNumbers.forEach(buildAlbum);
})();
</script>
</body>
</html>
