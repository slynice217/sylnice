<script>
(() => {
  'use strict';
  const albumNumbers = [1, 2, 3];
  const photoCount = 5;

  // 图集二每张照片翻面后的文字：以后直接编辑下面对应的引号内容即可。
  const album2BackTexts = [
    '三年前，完全松弛感…',
    '某个儿童节她竟然给我买礼物，因为不知道我喜欢啥买了两个阿尼亚哈哈哈哈',
    '这是买DJI的第一天拍的，好萌吧',
    '建模怪连走路随便拍都能出片啥意思。',
    '♡'
  ];
  const root = document.getElementById('albums');
  if (!root) return;

  function buildAlbum(number) {
    const section = document.createElement('section');
    section.className = 'album';
    const title = document.createElement('div');
    title.className = 'album-title';
    title.textContent = number === 2 ? '点击可翻面' : number === 3 ? '宝贝nikki' : '图集' + number;
    section.appendChild(title);

    const carousel = document.createElement('div');
    carousel.className = 'album-carousel depth-stack';
    carousel.setAttribute('aria-label', title.textContent + '，左右滑动切换照片');
    const track = document.createElement('div');
    track.className = 'album-track';

    for (let index = 1; index <= photoCount; index++) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'depth-card';
      card.setAttribute('aria-label', '照片 ' + index + '，点击翻面');
      card.innerHTML = number === 2
        ? '<div class="depth-card-inner"><div class="depth-face depth-front"><img alt="" draggable="false"></div><div class="depth-face depth-back"><span>0' + index + ' / 05</span><h3>图集 2</h3><p></p><small>点击翻回照片</small></div></div>'
        : '<div class="depth-card-inner"><div class="depth-face depth-front"><img alt="" draggable="false"></div></div>';
      if (number === 2) card.querySelector('.depth-back p').textContent = album2BackTexts[index - 1];
      const img = card.querySelector('img');
      img.src = './assets/gallery/album' + number + '/' + index + '.webp';
      img.decoding = 'async';
      img.onerror = () => {
        card.classList.add('photo-missing');
        img.alt = '图集' + number + '的第' + index + '张照片尚未上传';
        img.removeAttribute('src');
        card.disabled = true;
      };
      if (number === 2) card.addEventListener('click', () => card.classList.toggle('is-flipped'));
      track.appendChild(card);
    }

    carousel.appendChild(track);
    section.appendChild(carousel);
    root.appendChild(section);

    const cards = Array.from(track.children);
    let current = 0;
    let startX = 0;
    let startY = 0;
    let dragging = false;
    function render() {
      cards.forEach((card, i) => {
        let offset = i - current;
        if (offset > cards.length / 2) offset -= cards.length;
        if (offset < -cards.length / 2) offset += cards.length;
        const distance = Math.abs(offset);
        const x = offset * (window.innerWidth <= 600 ? 30 : 40);
        card.style.transform = 'translate3d(' + x + 'px,' + (distance * 5) + 'px,' + (-distance * 95) + 'px) rotateY(' + (-offset * 13) + 'deg) rotateZ(' + (-offset * 2.5) + 'deg) scale(' + (offset === 0 ? .9 : Math.max(.62, .9 - distance * .09)) + ')';
        card.style.zIndex = String(10 - distance);
        card.style.opacity = distance > 2 ? '0' : '1';
        card.style.pointerEvents = distance > 2 ? 'none' : 'auto';
        card.tabIndex = distance === 0 ? 0 : -1;
      });
    }

    carousel.addEventListener('pointerdown', event => {
      startX = event.clientX;
      startY = event.clientY;
      dragging = true;
    });
    carousel.addEventListener('pointerup', event => {
      if (!dragging) return;
      dragging = false;
      const dx = event.clientX - startX;
      const dy = event.clientY - startY;
      if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy)) {
        current = (current + (dx < 0 ? 1 : -1) + cards.length) % cards.length;
        render();
      }
    });
    carousel.addEventListener('pointercancel', () => { dragging = false; });
    render();
  }

  albumNumbers.forEach(buildAlbum);
})();
</script>

        if (!saved.has(attr)) saved.set(attr, el.getAttribute(attr));
        const next = convert(saved.get(attr), language);
        if (el.getAttribute(attr) !== next) el.setAttribute(attr, next);
      });
    });
  }
  toggle.dataset.lang = language;
  toggle.setAttribute('aria-checked', language === 'tw' ? 'true' : 'false');
  document.documentElement.lang = language === 'tw' ? 'zh-Hant' : 'zh-Hans';
  toggle.addEventListener('click', function () {
    language = language === 'cn' ? 'tw' : 'cn';
    try { window.localStorage.setItem('sylnice-language', language); } catch (e) {}
    toggle.dataset.lang = language;
    toggle.setAttribute('aria-checked', language === 'tw' ? 'true' : 'false');
    document.documentElement.lang = language === 'tw' ? 'zh-Hant' : 'zh-Hans';
    process(document.body);
  });
  process(document.body);
  const observer = new MutationObserver(records => {
    for (const record of records) {
      if (record.type === 'characterData') {
        const node = record.target;
        if (originals.has(node)) { const next = convert(originals.get(node), language); if (node.nodeValue !== next) node.nodeValue = next; }
        else process(node.parentElement || document.body);
      } else record.addedNodes.forEach(node => {
        if (node.nodeType === Node.TEXT_NODE) process(node.parentElement || document.body);
        else if (node.nodeType === Node.ELEMENT_NODE && !node.closest('#site-language-toggle')) process(node);
      });
    }
  });
  observer.observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
