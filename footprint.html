.nav{padding:14px;text-align:center;background:#ffffffaa;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:0;z-index:10;white-space:nowrap;overflow-x:auto}

.station-dot:hover,.station-dot:focus-visible{background:rgba(133,92,201,.28);outline:2px solid #8a65c5;outline-offset:1px}
.station-dot:focus:not(:focus-visible){outline:none}
@media(max-width:600px){.nav{font-size:14px;padding:12px 6px}.nav a{margin:0 6px}main{padding:6px}h1{margin:10px 0 14px}.map-wrap{border-radius:4px}.station-dot{width:10px;height:10px}}
