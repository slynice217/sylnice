<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--active-card-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #app {
    flex: 1 0 auto;
  }
  .viewer-loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #666; }

  /* 站点导航栏：吸顶，毛玻璃微半透，层级高于画布 */
  .blokko-site-nav {
    position: sticky;
    top: 0;
    z-index: 9000;
    background: var(--color-card-bg, #ffffff);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-color, rgba(0, 0, 0, 0.08));
    flex-shrink: 0;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .blokko-site-nav-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 16px;
    min-height: 50px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }
  /* 自定义背景色时：去掉默认毛玻璃底色/模糊，并统一深色模式下的底色，确保整条 banner 都是自定义色 */
  .blokko-site-nav.has-custom-bg,
  html:not(.light-mode) .blokko-site-nav.has-custom-bg,
  html.dark-mode .blokko-site-nav.has-custom-bg {
    background: var(--nav-custom-bg, var(--color-card-bg, #ffffff));
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .blokko-nav-desktop {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: center;
  }
  /* 站点标识：logo + 标题（与编辑器 SiteNavBanner 一致） */
  .blokko-site-nav-brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-right: 6px;
  }
  .blokko-site-nav-logo {
    display: block;
    object-fit: contain;
    border-radius: 4px;
  }
  .blokko-site-nav-title {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .blokko-site-nav-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text-primary, #111111);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.18s ease, color 0.18s ease, transform 0.15s ease;
    cursor: pointer;
    user-select: none;
  }
  .blokko-site-nav-link:hover {
    background: var(--color-hover, rgba(0, 0, 0, 0.05));
    color: var(--color-primary, #007AFF);
  }
  .blokko-site-nav-link[data-blokko-nav-current="true"],
  .blokko-site-nav-link.is-active,
  .blokko-site-nav-link.is-parent-active {
    color: var(--color-primary, #007AFF);
    font-weight: 600;
    background: var(--color-active, rgba(0, 122, 255, 0.08));
  }

  /* 桌面端二级悬浮下拉菜单 */
  .blokko-site-nav-dropdown {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .blokko-nav-chevron {
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity: 0.7;
    margin-left: 2px;
  }
  .blokko-site-nav-dropdown:hover .blokko-nav-chevron,
  .blokko-site-nav-dropdown.is-open .blokko-nav-chevron {
    transform: rotate(180deg);
    opacity: 1;
  }
  .blokko-site-nav-dropdown-menu {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.2s;
    transition-delay: 60ms; /* safe hover 防抖闭合 */
    z-index: 9999;
  }
  /* Safe-Hover 隐形透明安全桥垫：填补 trigger 与 menu 间隙，彻底杜绝划入时意外断连 */
  .blokko-site-nav-dropdown-menu::before {
    content: '';
    position: absolute;
    top: -12px;
    left: 0;
    right: 0;
    height: 12px;
  }
  .blokko-site-nav-dropdown:hover .blokko-site-nav-dropdown-menu,
  .blokko-site-nav-dropdown:focus-within .blokko-site-nav-dropdown-menu {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
    transition-delay: 0s;
  }
  .blokko-dropdown-menu-inner {
    min-width: 150px;
    max-width: 260px;
    /* 下拉浮层配色跟随 banner 外观（由 --nav-menu-* 内联变量派生，与编辑器预览一致） */
    background: var(--nav-menu-bg, var(--color-card-bg, rgba(255, 255, 255, 0.95)));
    color: var(--nav-menu-fg, var(--text-primary, #222222));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--nav-menu-border, var(--border-color, rgba(0, 0, 0, 0.08)));
    border-radius: 14px;
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.12), 0 4px 10px -2px rgba(0, 0, 0, 0.05);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .blokko-dropdown-item {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.88rem;
    color: inherit;
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .blokko-dropdown-item:hover {
    background: var(--nav-menu-hover, var(--color-hover, rgba(0, 0, 0, 0.05)));
    color: var(--color-primary, #007AFF);
    transform: translateX(2px);
  }
  .blokko-dropdown-item[data-blokko-nav-current="true"],
  .blokko-dropdown-item.is-active {
    color: var(--color-primary, #007AFF);
    font-weight: 600;
    background: var(--color-active, rgba(0, 122, 255, 0.08));
  }

  /* 移动端汉堡包按钮与侧边抽屉 */
  .blokko-nav-burger {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    width: 36px;
    height: 36px;
    padding: 0;
    background: transparent;
    border: none;
    cursor: pointer;
    margin-left: auto;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .blokko-nav-burger:hover {
    background: var(--color-hover, rgba(0, 0, 0, 0.05));
  }
  .blokko-burger-bar {
    width: 20px;
    height: 2px;
    background-color: var(--text-primary, #222222);
    border-radius: 2px;
    transition: transform 0.25s ease, opacity 0.2s ease;
  }
  .blokko-site-nav.is-mobile-open .blokko-burger-bar:nth-child(1) {
    transform: translateY(6px) rotate(45deg);
  }
  .blokko-site-nav.is-mobile-open .blokko-burger-bar:nth-child(2) {
    opacity: 0;
  }
  .blokko-site-nav.is-mobile-open .blokko-burger-bar:nth-child(3) {
    transform: translateY(-6px) rotate(-45deg);
  }

  .blokko-mobile-drawer {
    display: none;
  }
  /* 抽屉打开时整体抬升层级：nav 是 sticky + z-index + backdrop-filter，自身创建 stacking context，
     抽屉(9999)与遮罩(9998)会被困在 nav 的 9000 层内——页面里任何 z>9000 的元素（如图片放大层）都会压住抽屉。
     打开期间把 nav 提到最高层，并临时去掉 backdrop-filter，规避部分浏览器将其作为 fixed 后代 containing block 的差异 */
  .blokko-site-nav.is-mobile-open {
    z-index: 99999;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .blokko-mobile-drawer-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 9998;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .blokko-mobile-drawer-content {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 280px;
    max-width: 82vw;
    background: var(--color-card-bg, #ffffff);
    z-index: 9999;
    box-shadow: -8px 0 24px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .blokko-site-nav.is-mobile-open .blokko-mobile-drawer-backdrop {
    opacity: 1;
    pointer-events: auto;
  }
  .blokko-site-nav.is-mobile-open .blokko-mobile-drawer-content {
    transform: translateX(0);
  }
  .blokko-mobile-drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color, rgba(0, 0, 0, 0.08));
  }
  .blokko-mobile-drawer-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary, #111111);
  }
  .blokko-mobile-close-btn {
    border: none;
    background: transparent;
    padding: 4px;
    cursor: pointer;
    color: var(--text-secondary, #666666);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .blokko-mobile-close-btn:hover {
    background: var(--color-hover, rgba(0, 0, 0, 0.05));
    color: var(--text-primary, #111111);
  }
  .blokko-mobile-nav-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .blokko-mobile-nav-item {
    display: block;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    color: var(--text-primary, #111111);
    text-decoration: none;
    font-weight: 500;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .blokko-mobile-nav-item:hover,
  .blokko-mobile-nav-item:active {
    background: var(--color-hover, rgba(0, 0, 0, 0.05));
  }
  .blokko-mobile-nav-item[data-blokko-nav-current="true"],
  .blokko-mobile-nav-item.is-active {
    color: var(--color-primary, #007AFF);
    font-weight: 600;
    background: var(--color-active, rgba(0, 122, 255, 0.08));
  }

  /* 移动端手风琴折叠菜单 */
  .blokko-mobile-accordion {
    border-radius: 8px;
    overflow: hidden;
  }
  .blokko-mobile-accordion-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .blokko-accordion-main-link {
    flex: 1;
  }
  .blokko-accordion-toggle {
    background: transparent;
    border: none;
    padding: 10px 14px;
    cursor: pointer;
    color: var(--text-secondary, #888888);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease;
  }
  .blokko-accordion-toggle:hover {
    color: var(--text-primary, #111111);
  }
  .blokko-accordion-arrow {
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .blokko-mobile-accordion.is-expanded .blokko-accordion-arrow {
    transform: rotate(180deg);
  }
  .blokko-mobile-accordion-body {
    display: none;
    padding-left: 14px;
    margin-top: 2px;
    border-left: 2px solid var(--border-color, rgba(0, 0, 0, 0.08));
    margin-left: 14px;
    flex-direction: column;
    gap: 2px;
  }
  .blokko-mobile-accordion.is-expanded .blokko-mobile-accordion-body {
    display: flex;
  }
  .blokko-mobile-sub-item {
    display: block;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.9rem;
    color: var(--text-secondary, #555555);
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .blokko-mobile-sub-item:hover {
    background: var(--color-hover, rgba(0, 0, 0, 0.05));
    color: var(--color-primary, #007AFF);
  }
  .blokko-mobile-sub-item[data-blokko-nav-current="true"],
  .blokko-mobile-sub-item.is-active {
    color: var(--color-primary, #007AFF);
    font-weight: 600;
    background: var(--color-active, rgba(0, 122, 255, 0.08));
  }

  @media (max-width: 768px) {
    /* 给右上角语言切换按钮预留空间，避免它遮住手机端导航汉堡按钮 */
    .blokko-site-nav-inner { justify-content: space-between; min-height: 46px; padding: 0 98px 0 14px !important; }
    .blokko-nav-burger { flex: 0 0 36px; position: relative; z-index: 2; }
    .blokko-nav-desktop { display: none; }
    .blokko-nav-burger { display: flex; }
    .blokko-mobile-drawer { display: block; }
  }

  /* 站点页脚样式 */
  .blokko-site-footer {
    flex-shrink: 0;
    border-top: 1px solid var(--border-color, rgba(0, 0, 0, 0.08));
    background: var(--color-card-bg, #ffffff);
    padding: 24px 16px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-secondary, #666666);
    line-height: 1.6;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .blokko-site-footer a {
    color: inherit;
    text-decoration: none;
    transition: color 0.15s ease;
  }
  .blokko-site-footer a:hover {
    color: var(--color-primary, #007AFF);
    text-decoration: underline;
  }
  .blokko-footer-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    max-width: 960px;
    margin: 0 auto;
  }
  .blokko-footer-links {
    margin-top: 4px;
    font-size: 0.82rem;
  }

  /* 深色模式自适应：当未显式锁定 light 类且系统偏好深色时，自动启用深色样式 */
  @media (prefers-color-scheme: dark) {
    html:not(.light-mode) {
      --bg-preview-pane: #0f1115;
      --bg-color: #0f1115;
      --color-card-bg: #1c1e24;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-primary: #f0f2f5;
      --text-secondary: #9aa0a6;
      --color-hover: rgba(255, 255, 255, 0.08);
      --color-active: rgba(0, 122, 255, 0.18);
    }
    html:not(.light-mode) body {
      background: var(--bg-preview-pane, #0f1115);
      color: var(--text-primary, #f0f2f5);
    }
    html:not(.light-mode) .blokko-site-nav {
      background: #17191e;
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }
    html:not(.light-mode) .blokko-site-nav-link {
      color: #e2e8f0;
    }
    html:not(.light-mode) .blokko-site-nav-link:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    html:not(.light-mode) .blokko-site-footer {
      background: #17191e;
      border-top-color: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
    }
    html:not(.light-mode) .not-found-card {
      background: #1c1e24;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    html:not(.light-mode) .not-found-title {
      color: #f0f2f5;
    }
    html:not(.light-mode) .not-found-desc {
      color: #94a3b8;
    }
  }

  /* 显式带有 .dark-mode 时的样式补全 */
  html.dark-mode {
    --bg-preview-pane: #0f1115;
    --bg-color: #0f1115;
    --color-card-bg: #1c1e24;
    --border-color: rgba(255, 255, 255, 0.1);
    --text-primary: #f0f2f5;
    --text-secondary: #9aa0a6;
    --color-hover: rgba(255, 255, 255, 0.08);
    --color-active: rgba(0, 122, 255, 0.18);
  }
  html.dark-mode body {
    background: var(--bg-preview-pane, #0f1115);
    color: var(--text-primary, #f0f2f5);
  }
  html.dark-mode .blokko-site-nav {
    background: #17191e;
    border-bottom-color: rgba(255, 255, 255, 0.1);
  }
  html.dark-mode .blokko-site-nav-link {
    color: #e2e8f0;
  }
  html.dark-mode .blokko-site-nav-link:hover {
    background: rgba(255, 255, 255, 0.08);
  }
  html.dark-mode .blokko-site-footer {
    background: #17191e;
    border-top-color: rgba(255, 255, 255, 0.1);
    color: #94a3b8;
  }
  html.dark-mode .not-found-card {
    background: #1c1e24;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  html.dark-mode .not-found-title {
    color: #f0f2f5;
  }
  html.dark-mode .not-found-desc {
    color: #94a3b8;
  }

  @media (max-width: 768px) {
    .blokko-site-nav-inner { justify-content: flex-start; min-height: 42px; padding: 0 10px; }
    .blokko-site-nav-link { padding: 5px 11px; font-size: 0.85rem; }
    .blokko-site-footer { padding: 18px 12px; font-size: 0.8rem; }
  }
</style>

cription":"","keywords":"","noindex":false},"children":[{"id":"card_kockrgsx8","type":"card","isVisible":true,"title":"记录第一次vibecoding","content":"\u003cp>2026.10.1\u003c/p>\u003cp>这是我从想法到行动的第一天\u003c/p>\u003cp>跟着xhs登录了github,vercel,antigravity,cursor等等一系列工具\u003c/p>\u003cp>然后纯用prompt在cursor用grok生成了一个简单的自我介绍页面，但是没一会免费token就用完了。而且我不太喜欢告诉ai需求再等待他端上成品的过程\u003c/p>\u003cp>然后我就找到了一个可以导出html的前端工具blokko！遂开始手搓页面！\u003c/p>\u003cp>\u003c/p>\u003cp>2026.10.9\u003c/p>\u003cp>在前端初步整好了框架和内容，但是导入到github之后不知道怎么部署成真正的网页，页面和xhs的教程不一样。\u003c/p>\u003cp>然后我就改用了vercel，竟然真的弄成了一个网页！好坤动啊啊啊啊（不过非常简陋，只有简介mbti爱好时间轴部分\u003c/p>\u003cp>\u003c/p>\u003cp>2026.10.10\u003c/p>\u003cp>还是决定用回github因为vercel部署的要翻墙才能打开\u003c/p>\u003cp>发现是没有把github访问权限调成公开。\u003c/p>\u003cp>终于生成了网址点进去一看图片全都没了，而且文字部分的换行都变成了&lt;p&gt;。。\u003c/p>\u003cp>经过gpt老师的帮助和我自己的摸索\u003c/p>\u003cp>发现是导入的时候漏了两个文件夹。（所以还是得拖拽导入才行）\u003c/p>\u003ch3>\u003cspan style=\"color: rgb(103, 65, 150);\">就这样我的第一个个人网站上线了!!!!\u003c/span>\u003c/h3>\u003cp>接着让gpt弄了一个语言转换按钮（竟然不用充plus也能直接帮我改6666）\u003c/p>\u003cp>电脑上打开和手机上感受完全不一样啊啊!!!我现在超级开心!!!\u003c/p>\u003cp>\u003cstrong>所以建议有条件的一定一定要自己试一下呀!!!\u003c/strong>\u003c/p>\u003cp>\u003c/p>\u003cp>等我以后熟练一点我会进行一个超级大升级，不用blokko的那种，因为现在的页面太朴素了，我想加好多动效让这个网站变得超级高坤\u003c/p>\u003cp>持续更新...\u003c/p>","cardStyle":"default","sticker":"none","imageFillMode":"cover","layout":{"width":100,"height":"auto"},"writingMode":"horizontal-tb","textAlign":"","_activeSections":["common.radius"],"opacity":0.9,"bgMode":"image","hasAlpha":false,"bgImageDataUrl":"assets/media/x4n0c2.jpg","bgImageY":50}],"layout":{"width":100,"savedPortraitWidth":100,"savedLandscapeWidth":100}}],"stickers":[],"pageStyles":{"pageBgMode":"solid","pageBgDayNight":"day","pageBgSolidColor":"#e8e3f2","pageBgNightSolidColor":"#121417","pageBgNightGradientStart":"#1a1d24","pageBgNightGradientEnd":"#0d0f14","pageBgImageDataUrl":null,"pageBgRepeat":"no-repeat","pageBgSize":"cover","pageBgImageAttribution":null,"pageBgGradientStart":"#f5f3ff","pageBgGradientEnd":"#ede9fe","
