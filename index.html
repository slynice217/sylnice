  /* 桌面端二级悬浮下拉菜单 */
  .blokko-site-nav-dropdown {
    position: relative;

    align-items: center;

    transform: rotate(180deg);

  }
  .blokko-site-nav-dropdown-menu {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition-delay: 60ms; /* safe hover 防抖闭合 */
    z-index: 9999;
  }
  /* Safe-Hover 隐形透明安全桥垫：填补 trigger 与 menu 间隙，彻底杜绝划入时意外断连 */
  .blokko-site-nav-dropdown-menu::before {
    content: '';
    position: absolute;
    top: -12px;
    left: 0;
    right: 0;
    height: 12px;
  }
  .blokko-site-nav-dropdown:hover .blokko-site-nav-dropdown-menu,

  .blokko-mobile-drawer {
    display: none;

  /* 抽屉打开时整体抬升层级：nav 是 sticky + z-index + backdrop-filter，自身创建 stacking context，
     抽屉(9999)与遮罩(9998)会被困在 nav 的 9000 层内——页面里任何 z>9000 的元素（如图片放大层）都会压住抽屉。
     打开期间把 nav 提到最高层，并临时去掉 backdrop-filter，规避部分浏览器将其作为 fixed 后代 containing block 的差异 */

sker":"匿名提问","answer":"\u003cp>咳咳（）nice是我英文名后半段，至于syl是谁的名字(的一部分)，\u003c/p>\u003cp>你猜呀\u003c/p>","accentColor":"#b898e0","bgColor":null,"textColor":null,"layout":{"width":100,"height":"auto","savedPortraitWidth":100,"savedLandscapeWidth":100}},{"id":"qa_1791554529055_zxn3","type":"qa","isVisible":true,"styleVariant":"default","icon":"mdi:message-question-outline","question":"为什么突然想到做这个网站？","asker":"匿名提问","answer":"\u003cp>emm 最近vibecoding风很大我这么爱跟风肯定要玩下啦\u003c/p>\u003cp>而且很高坤 又可以装\u003c/p>\u003cp>...呃其实是想被看见呢。\u003c/p>\u003cp>据说我们永远无法真正了解一个人（就像没人能同时拥有我上面的三个社交账号），既然如此，我不妨勇敢一点、写多一点，哪怕能让你窥见一点点真实的我呢？（srds，真的有人会看吗\u003c/p>\u003cp>这里引用一位我很欣赏很佩服的朋友说过的：“可能是表达出在意的时候就好像把刀递给别人了那样，或者是羞耻心作祟，又或者是担心展露真心会有一天被摔得粉碎。这样子等真正分别的时候就会显得体面一点。”\u003c/p>\u003cp>我很怕一不小心就overshare 导致连主动发信息都不习惯。（在学了在学了！\u003c/p>","accentColor":"#9a7bc0","bgColor":null,"textColor":null,"layout":{"width":100,"height":"auto","savedPortraitWidth":100,"savedLandscapeWidth":100}},{"id":"qa_1791555559380_mu5q","type":"qa","isVisible":true,"styleVariant":"default","icon":"mdi:message-question-outline","question":"向往的16岁，成为了小时候梦想的样子吗？","asker":"匿名提问","answer":"\u003cp>为什么向往16岁呢，因为小学的时候网上“交友”一直谎报自己16岁。\u003c/p>\u003cp>而且说实话我真不知道小时候梦想的现在是什么样子。\u003c/p>\u003cp>但现在来说，我这16年过来好像还挺厉害的。\u003c/p>\u003cp>原来我才16岁吗？\u003c/p>","accentColor":"#795d9b","bgColor":null,"textColor":null,"layout":{"width":100,"height":"auto","savedPortraitWidth":100,"savedLandscapeWidth":100}},{"id":"qa_1791556436554_jhce","type":"qa","isVisible":true,"styleVariant":"default","icon":"mdi:message-question-outline","question":"主播主播为啥我没找到匿名提问的入口？？","asker":"匿名提问","answer":"\u003cp>因为根本就没有这个入口呀宝贝\u003c/p>\u003cp>这些提问的都是我自己哈哈哈（包括你）\u003c/p>\u003cp>但有想问的可以在这里哦\u003c/p>\u003cp>\u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://qntwx.com/sylnice\">点这里\u003c/a>\u003c/p>","accentColor":"#604a7c","bgColor":null,"textColor":null,"layout":{"width":100,"height":"auto","savedPortraitWidth":100,"savedLandscapeWidth":100},"interactions":{"enableScr o":{"title":"","description":"","keywords":"","noindex":false},"children":[{"id":"card_kockrgsx8","type":"card","isVisible":true,"title":"记录第一次vibecoding","content":"\u003cp>2026.10.1\u003c/p>\u003cp>这是我从想法到行动的第一天\u003c/p>\u003cp>跟着xhs登录了github,vercel,antigravity,cursor等等的工具\u003c/p>\u003cp>然后纯用prompt在cursor生成了一个简单的自我介绍页面，但是免费token一下就用完了。而且我不太喜欢告诉ai需求再等待他端上成品的过程\u003c/p>\u003cp>不过我找到了一个可以导出html的前端工具blokko！遂开始手搓页面！\u003c/p>\u003cp>\u003c/p>\u003cp>2026.10.9\u003c/p>\u003cp>在前端初步整好了框架和内容，但是导入到github之后不知道咋了，页面和xhs的教程不一样呃。\u003c/p>\u003cp>然后我就改用了vercel，竟然真的弄成了一个网页！好坤动啊啊啊啊（不过非常简陋，只有简介mbti爱好时间轴部分\u003c/p>\u003cp>\u003c/p>\u003cp>2026.10.10\u003c/p>\u003cp>最后还是决定用回github因为vercel的网站要翻墙才能打开\u003c/p>\u003cp>而且发现是没有把github访问权限调成公开。\u003c/p>\u003cp>终于生成了网址点进去一看图片全都没了，而且文字部分的换行都变成了&lt;p&gt;。。\u003c/p>\u003cp>经过gpt老师的帮助和我自己的摸索\u003c/p>\u003cp>发现是导入的时候漏了两个文件夹。（所以还是得拖拽导入才行）\u003c/p>\u003ch3>\u003cspan style=\"color: rgb(103, 65, 150);\">就这样我的第一个个人网站上线了!!!!\u003c/span>\u003c/h3>\u003cp>接着让gpt弄了一个语言转换按钮（竟然不用充plus也能直接帮我改6666）\u003c/p>\u003cp>电脑上打开和手机上感受完全不一样啊啊!!!我现在超级开心!!!\u003c/p>\u003cp>\u003cstrong>所以建议有条件的一定一定要自己试一下呀!!!\u003c/strong>\u003c/p>\u003cp>\u003c/p>\u003cp>等我以后熟练一点我会进行一个超级大升级，不用blokko的那种，因为现在的页面一眼就是ai的，我想加好多动效让这个网站变得超级高坤\u003c/p>\u003cp>持续更新...\u003c/p>","cardStyle":"default","sticker":"none","imageFillMode":"cover","layout":{"width":100,"height":"auto"},"writingMode":"horizontal-tb","textAlign":"","_activeSections":["common.radius"],"opacity":0.9,"bgMode":"image","hasAlpha":false,"bgImageDataUrl":"assets/media/x4n0c2.jpg","bgImageY":50}],"layout":{"width":100,"savedPortraitWidth":100,"savedLandscapeWidth":100}}],"stickers":[],"pageStyles":{"pageBgMode":"solid","pageBgDayNight":"day","pageBgSolidColor":"#e8e3f2","pageBgNightSolidColor":"#121417","pageBgNightGradientStart":"#1a1d24","pageBgNightGradientEnd":"#0d0f14","pageBgImageDataUrl":null,"pageBgRepeat":"no-repeat","pageBgSize":"cover","pageBgImageAttribution":null,"pageBgGradientStart":"#f5f3ff","pageBgGradientEnd":"     return String(value || '').replace(/\s+/g, '').toLowerCase();
  }
  function destinationFor(target) {
    if (!(target instanceof Element)) return null;
    var nodes = typeof target.composedPath === 'function' ? target.composedPath() : [];
    if (!nodes.length) {
      for (var node = target; node; node = node.parentElement) nodes.push(node);
    }
    for (var i = 0; i < nodes.length && i < 12; i++) {
      var node = nodes[i];
      if (!(node instanceof Element)) continue;
      // The visible URL in the rich-text answer must behave as a normal hyperlink.
      if (node.matches('a[href]')) {
        var href = node.getAttribute('href') || '';
        if (/^https?:\/\/qntwx\.com\/sylnice\/?(?:[?#].*)?$/i.test(href)) return destinations.qntwx;
      }
      var label = normalize(node.innerText || node.textContent);
      var icon = normalize((node.getAttribute('data-icon') || '') + ' ' + (node.getAttribute('class') || ''));
      if (label === 'sylnice217' || icon.indexOf('wechat') !== -1) return destinations.qntwx;
      if (label === 'sylnice_217' || icon.indexOf('instagram') !== -1) return destinations.instagram;
      if (i >= 2 && label.length > 80) break;
    }
    return null;
  }
  function interceptSocialNavigation(event) {
    var destination = destinationFor(event.target);
    if (!destination) return;
    event.preventDefault();
    event.stopPropagation();
    if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
    // Navigate on the initial press, before Blokko can open its interaction popup.
    if (event.type === 'pointerdown' || event.type === 'mousedown' || event.type === 'click') {
      window.location.href = destination;
    }
  }
  ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click'].forEach(function (type) {
    document.addEventListener(type, interceptSocialNavigation, true);
  });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script id="visitor-comments-app">
(function(){
  const PROJECT_URL = 'https://qqduizywyinbvyozjavm.supabase.co';
  const PUBLISHABLE_KEY = 'sb_publishable_db5BibzV9MY4wRJvsc9GOg_91mmQkjd';
  const form = document.getElementById('visitor-comment-form');
  if (!form) return;
  const nicknameInput = document.getElementById('visitor-comment-nickname');
  const messageInput = document.getElementById('visitor-comment-message');
  const status = document.getElementById('visitor-comment-status');
  const submit = document.getElementById('visitor-comment-submit');
  const list = document.getElementById('visitor-comments-list');
  const refresh = document.getElementById('visitor-comment-refresh');
  if (!window.supabase || !window.supabase.createClient) {
    status.textContent = '留言服务加载失败，请刷新页面后重试。';
    list.textContent = '暂时无法连接留言服务。';
    return;
  }
  const db = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function setStatus(text, isError) {
    status.textContent = text;
    status.style.color = isError ? '#b42318' : '';
  }
  function formatDate(value) {
    if (value === null || value === undefined || value === '') return '時間未知';
    // Handle Unix timestamps in seconds or milliseconds as well as ISO date strings.
    let date;
    if (typeof value === 'number' || /^\d+(\.\d+)?$/.test(String(value).trim())) {
      let timestamp = Number(value);
      if (timestamp < 100000000000) timestamp *= 1000;
      date = new Date(timestamp);
    } else {
      date = new Date(value);
    }
    if (Number.isNaN(date.getTime()) || date.getUTCFullYear() <= 1970) return '時間未知';
    return date.toLocaleString(undefined, {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }
  async function loadComments() {
    list.replaceChildren(el('p','visitor-comments-empty','正在加载留言……'));
    const result = await db.from('site_comments').select('id,nickname,message,created_at').order('created_at',{ascending:false}).limit(100);
    if (result.error) {
      list.replaceChildren(el('p','visitor-comments-empty','暂时无法读取留言。请确认已在 Supabase 创建 site_comments 表并设置公开读取权限。'));
      setStatus('留言服务尚未配置完成。', true);
      return;
    }
    list.replaceChildren();
    if (!result.data || !result.data.length) {
      list.append(el('p','visitor-comments-empty','还没有留言，来写下第一条吧。'));
      return;
    }
    result.data.forEach(row => {
      const item = el('article','visitor-comment-item');
      const meta = el('div','visitor-comment-meta');
      meta.append(el('span','visitor-comment-name',row.nickname || '访客'));
      meta.append(el('time','visitor-comment-date',formatDate(row.created_at)));
      const body = el('p','visitor-comment-body',row.message || '');
      item.append(meta,body);
      list.append(item);
    });
  }
  form.addEventListener('submit', async function(event) {
    event.preventDefault();
    const nickname = nicknameInput.value.trim();
    const message = messageInput.value.trim();
    if (!nickname || !message) { setStatus('请填写昵称和留言内容。', true); return; }
    if (nickname.length > 40 || message.length > 2000) { setStatus('昵称最多 40 字，留言最多 2000 字。', true); return; }
    submit.disabled = true;
    setStatus('正在发布留言……');
    const result = await db.from('site_comments').insert({nickname, message});
    submit.disabled = false;
    if (result.error) {
      setStatus('发布失败，请确认 Supabase 的 site_comments 表及匿名插入权限已设置。', true);
      return;
    }
    messageInput.value = '';
    setStatus('发布成功！');
    await loadComments();
  });
  refresh.addEventListener('click', loadComments);
  loadComments();
  // Refresh periodically so visitors see newly posted messages without manually reloading.
  window.setInterval(loadComments, 15000);
})();
</script>
